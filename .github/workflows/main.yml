name: NRAI Website 24-7 Monitor
on:
  schedule:
    # Runs every 15 minutes, 24/7 (365 days a year)
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run NRAI Monitor
        env:
          NTFY_TOPIC: nrai-live-updates-iphone
        run: |
          python3 monitor.py --once
      - name: Save Updated Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_updates.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen notices [skip ci]" && git push)
